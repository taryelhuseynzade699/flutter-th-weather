name: Generate and Verify New Flutter Project

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Bu düymə layihəni GitHub panelindən əllə başlatmağa imkan verir

jobs:
  generate_project:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@main

      - name: Set up Java
        uses: actions/setup-java@main
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@main
        with:
          channel: 'stable'
          cache: true

      # GitHub serverində tamamilə yeni layihə yaradılır
      - name: Create New Flutter Project
        run: flutter create --platforms=android,ios flutter-th-weather

      # Yaradılmış layihənin qovluğuna keçid edib asılılıqlar yüklənir
      - name: Install Dependencies
        run: |
          cd flutter-th-weather
          flutter pub get

      # Yeni yaradılan layihənin işlək olub-olmadığı yoxlanılır
      - name: Build Test APK
        run: |
          cd flutter-th-weather
          flutter build apk --release
